<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Tết AI 2026 - 3D Swing</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #b31217; --gold: #ffd700; --cream: #fff8e1; }
        body {
            margin: 0; overflow: hidden; background: radial-gradient(circle, #8b0000, #4a0000);
            font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

        /* Form cài đặt ban đầu */
        .setup-box {
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; 
            border: 3px solid var(--gold); text-align: center; z-index: 100; width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { font-size: 0.8rem; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; outline: none; }
        button#genBtn { 
            background: var(--red); color: var(--gold); border: none; padding: 14px; 
            width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* Container 3D */
        .scene { width: 320px; height: 460px; perspective: 1500px; display: none; z-index: 20; }

        /* Hiệu ứng quay 30 độ liên tục */
        @keyframes swing3D {
            0% { transform: rotateY(-30deg) rotateX(5deg); }
            50% { transform: rotateY(30deg) rotateX(-5deg); }
            100% { transform: rotateY(-30deg) rotateX(5deg); }
        }

        .card {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            animation: swing3D 4s infinite ease-in-out; /* Quay liên tục */
        }

        /* Khi mở thiệp: Dừng quay và lật 180 độ */
        .card.is-opened { 
            animation: none !important; 
            transform: rotateY(180deg) !important; 
        }

        .face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 15px; border: 6px solid var(--gold); display: flex; 
            flex-direction: column; align-items: center; justify-content: center; padding: 30px; box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        
        .front { 
            background: var(--red); color: var(--gold);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
        }
        .front .title-art { font-family: 'Dancing Script'; font-size: 4.5rem; margin: 0; line-height: 1; }
        .front .sub-title { font-size: 1.2rem; letter-spacing: 2px; margin-top: 20px; border-top: 1px solid var(--gold); padding-top: 10px; }

        .back { background: var(--cream); color: #333; transform: rotateY(180deg); }
        .wish-box { font-family: 'Dancing Script'; font-size: 1.6rem; line-height: 1.4; color: var(--red); text-align: center; }

        #musicBtn {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            background: var(--gold); border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: none;
            box-shadow: 0 0 15px var(--gold); font-size: 1.2rem;
        }
        .falling { position: absolute; top: -50px; animation: fall linear forwards; z-index: 50; pointer-events: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="tetMusic" loop>
        <source src="https://www.mboxdrive.com/ngayxuan.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" onclick="toggleMusic()">🎵</button>
    <canvas id="fireworks"></canvas>

    <div id="setup" class="setup-box">
        <h2 style="color:var(--red); font-family:'Dancing Script'; font-size: 2.2rem; margin:0">Tết Bính Ngọ 2026</h2>
        <div class="input-group">
            <label>Tên người nhận:</label>
            <input type="text" id="to" placeholder="Ví dụ: Lan Anh">
        </div>
        <div class="input-group">
            <label>Bạn gọi họ là:</label>
            <input type="text" id="callTo" placeholder="Ví dụ: Em, Cậu, Sếp...">
        </div>
        <div class="input-group">
            <label>Tên của bạn:</label>
            <input type="text" id="from" placeholder="Ví dụ: Hoàng">
        </div>
        <div class="input-group">
            <label>Bạn xưng mình là:</label>
            <input type="text" id="callFrom" placeholder="Ví dụ: Anh, Tớ, Con...">
        </div>
        <button id="genBtn" onclick="generateLink()">TẠO THIỆP & COPY LINK ✨</button>
        <div id="linkOutput" style="margin-top:10px; font-size:0.7rem; word-break:break-all; display:none; background:#f0f0f0; padding:10px; border-radius:5px;"></div>
    </div>

    <div id="scene" class="scene">
        <div id="card" class="card" onclick="openCard()">
            <div class="face front">
                <h1 class="title-art">Lời Chúc</h1>
                <div class="sub-title">XUÂN BÍNH NGỌ</div>
                <p style="margin-top: 40px;">Thân tặng: <b id="displayToName"></b></p>
                <small style="opacity: 0.8; animation: pulse 1.5s infinite;">(Bấm để mở thiệp 🧧)</small>
            </div>
            <div class="face back">
                <div style="font-size:0.7rem; color:#861a1a; margin-bottom: 10px;">MESSAGE FOR YOU</div>
                <div class="wish-box" id="displayWish"></div>
                <div style="width:100%; text-align:right; font-weight:bold; margin-top:50px; color: var(--red);">
                    Ký tên: <span id="displayFromName"></span>
                </div>
            </div>
        </div>
    </div>

<script>
    function generateLink() {
        const to = document.getElementById('to').value;
        const callTo = document.getElementById('callTo').value;
        const from = document.getElementById('from').value;
        const callFrom = document.getElementById('callFrom').value;
        if(!to || !from || !callTo || !callFrom) return alert("Vui lòng nhập đủ thông tin!");
        const params = new URLSearchParams({ t: to, ct: callTo, f: from, cf: callFrom });
        const link = window.location.href.split('?')[0] + '?' + params.toString();
        document.getElementById('linkOutput').innerText = link;
        document.getElementById('linkOutput').style.display = "block";
        navigator.clipboard.writeText(link);
        alert("Đã Copy Link thành công!");
    }

    function openCard() {
        const card = document.getElementById('card');
        if(!card.classList.contains('is-opened')) {
            card.classList.add('is-opened');
            const music = document.getElementById('tetMusic');
            music.play().catch(() => document.getElementById('musicBtn').style.display = 'block');
            setInterval(createFalling, 200);
            initFireworks();
        }
    }

    function createFalling() {
        const el = document.createElement('div');
        el.className = 'falling';
        el.innerHTML = Math.random() > 0.5 ? '🧧' : '🌸';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = Math.random() * 20 + 15 + 'px';
        el.style.animationDuration = Math.random() * 3 + 2 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
    }

    function initFireworks() {
        const c = document.getElementById('fireworks');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let p = [];
        function animate() {
            ctx.clearRect(0,0,c.width,c.height);
            if(p.length < 50) p.push({x:Math.random()*c.width, y:c.height, vx:Math.random()*4-2, vy:Math.random()*-10-5, col:`hsl(${Math.random()*360},100%,50%)`});
            p.forEach((i,idx) => {
                i.x += i.vx; i.y += i.vy; i.vy += 0.12;
                ctx.fillStyle = i.col; ctx.beginPath(); ctx.arc(i.x, i.y, 2.5, 0, 7); ctx.fill();
                if(i.y > c.height) p.splice(idx,1);
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    window.onload = () => {
        const p = new URLSearchParams(window.location.search);
        if(p.has('t')) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('scene').style.display = 'block';
            const to = p.get('t'), callTo = p.get('ct'), from = p.get('f'), callFrom = p.get('cf');
            document.getElementById('displayToName').innerText = to;
            document.getElementById('displayFromName').innerText = from;
            const aiWishes = [
                `Năm mới 2026, ${callFrom} chúc ${callTo} ${to} luôn mạnh khỏe, vạn sự hanh thông và mã đáo thành công nhé!`,
                `Xuân Bính Ngọ, ${callFrom} mong ${callTo} ${to} có một năm rực rỡ, tiền vào như nước và luôn hạnh phúc!`,
                `Chúc ${callTo} ${to} năm mới sức khỏe dồi dào, mọi dự định đều thành hiện thực rực rỡ. Từ ${callFrom} với rất nhiều yêu thương!`
            ];
            document.getElementById('displayWish').innerText = aiWishes[Math.floor(Math.random()*aiWishes.length)];
        }
    }
    function toggleMusic() { const m = document.getElementById('tetMusic'); m.paused ? m.play() : m.pause(); }
</script>
</body>
</html>
