<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Tết AI 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #b31217; --gold: #ffd700; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: radial-gradient(circle, #d32f2f, #8b0000);
            font-family: 'Quicksand', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        /* Hiệu ứng pháo hoa */
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }

        /* Form tạo thiệp */
        .setup-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 20px; border: 2px solid var(--gold);
            text-align: center; color: var(--gold); z-index: 100; width: 320px;
        }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button {
            background: var(--gold); color: var(--red); border: none;
            padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%;
        }

        /* Container 3D */
        .scene { width: 300px; height: 420px; perspective: 1500px; display: none; z-index: 20; }

        .card {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: swing 3s infinite ease-in-out;
        }

        @keyframes swing {
            0% { transform: rotateY(-15deg) rotateX(5deg); }
            50% { transform: rotateY(15deg) rotateX(-5deg); }
            100% { transform: rotateY(-15deg) rotateX(5deg); }
        }

        .card.is-opened { transform: rotateY(180deg) !important; animation: none; }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 15px; border: 5px solid var(--gold);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 25px; box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .front { background: var(--red); color: var(--gold); }
        .back { background: #fff; color: var(--red); transform: rotateY(180deg); }

        .wish-text { font-family: 'Dancing Script', cursive; font-size: 1.5rem; line-height: 1.4; margin: 15px 0; }
        
        /* Hiệu ứng rơi */
        .falling { position: absolute; top: -50px; z-index: 50; animation: fall linear forwards; pointer-events: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <audio id="tetMusic" loop prefetch="auto">
        <source src="https://files.catbox.moe/kpk2n7.mp3" type="audio/mpeg">
    </audio>

    <canvas id="fireworks"></canvas>

    <div id="setup" class="setup-box">
        <h2 style="font-family:'Dancing Script'">🧧 AI Card Tết 2026 🧧</h2>
        <input type="text" id="from" placeholder="Tên bạn">
        <input type="text" id="to" placeholder="Tên người nhận">
        <button onclick="generateAI()">TẠO LINK AI ✨</button>
        <div id="linkArea" class="hidden" style="margin-top:10px;">
            <small id="finalLink" style="word-break:break-all;color:#fff"></small><br>
            <button onclick="copy()" style="margin-top:5px;padding:5px">Copy Link</button>
        </div>
    </div>

    <div id="scene" class="scene">
        <div id="card" class="card" onclick="openCard()">
            <div class="card-face front">
                <h1 style="font-family:'Dancing Script'">Happy New Year</h1>
                <div style="font-size: 5rem;">🧧</div>
                <p>Thân tặng: <br><b id="displayTo"></b></p>
                <p style="font-size: 0.7rem; border: 1px dashed gold; padding: 5px;">BẤM ĐỂ MỞ & NGHE NHẠC</p>
            </div>
            <div class="card-face back">
                <p style="font-size: 0.8rem;">LỜI CHÚC AI 🤖</p>
                <div class="wish-text" id="displayWish"></div>
                <p style="text-align:right; width:100%;">Gửi từ: <b id="displayFrom"></b></p>
            </div>
        </div>
    </div>

<script>
    const aiWishes = [
        "Chúc {name} năm mới Long Phụng Sum Vầy, gia đình bình an, tài lộc tỉ tỉ!",
        "Tết 2026 chúc {name} luôn hoan hỉ, sức khỏe bền bỉ, tiền vào như ý!",
        "Chúc {name} vạn sự hanh thông, cả năm sung túc, lộc tới muôn nhà!"
    ];

    function generateAI() {
        const f = document.getElementById('from').value;
        const t = document.getElementById('to').value;
        if(!f || !t) return alert("Nhập đủ tên nhé!");
        const link = window.location.href.split('?')[0] + `?f=${encodeURIComponent(f)}&t=${encodeURIComponent(t)}`;
        document.getElementById('finalLink').innerText = link;
        document.getElementById('linkArea').classList.remove('hidden');
    }

    function copy() {
        navigator.clipboard.writeText(document.getElementById('finalLink').innerText);
        alert("Đã copy!");
    }

    function openCard() {
        const card = document.getElementById('card');
        const music = document.getElementById('tetMusic');
        if(!card.classList.contains('is-opened')) {
            card.classList.add('is-opened');
            
            // XỬ LÝ NHẠC: Buộc phát lại nếu bị chặn
            music.play().catch(() => {
                alert("Nhấn OK để nghe nhạc Ngày Xuân Long Phụng Sum Vầy!");
                music.play();
            });

            setInterval(createFalling, 150);
            initFireworks();
        }
    }

    function createFalling() {
        const el = document.createElement('div');
        el.className = 'falling';
        // Rơi cả hoa mai và bao lì xì
        el.innerHTML = Math.random() > 0.3 ? (Math.random() > 0.5 ? '🌸' : '🌼') : '🧧';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = Math.random() * 20 + 15 + 'px';
        el.style.animationDuration = Math.random() * 3 + 2 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
    }

    // Hiệu ứng pháo hoa đơn giản
    function initFireworks() {
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        function createParticle() {
            return {
                x: Math.random() * canvas.width,
                y: canvas.height,
                vx: Math.random() * 4 - 2,
                vy: Math.random() * -10 - 5,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                size: Math.random() * 3 + 1
            };
        }

        setInterval(() => { if(particles.length < 50) particles.push(createParticle()); }, 200);

        function update() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.1;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                if(p.y > canvas.height) particles.splice(i, 1);
            });
            requestAnimationFrame(update);
        }
        update();
    }

    window.onload = () => {
        const p = new URLSearchParams(window.location.search);
        const f = p.get('f'); const t = p.get('t');
        if(f && t) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('scene').style.display = 'block';
            document.getElementById('displayFrom').innerText = f;
            document.getElementById('displayTo').innerText = t;
            let wish = aiWishes[Math.floor(Math.random() * aiWishes.length)];
            document.getElementById('displayWish').innerText = wish.replace("{name}", t);
        }
    };
</script>
</body>
</html>
